# Sized for an 8 GB machine: the template's -Xmx8G would let Gradle take all RAM.
# Kotlin compiles inside the Gradle daemon instead of starting a second JVM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
